<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Lab anatomy spike</title>
    <style>
      :root {
        color: #f7f5ff;
        background: #13171f;
        font-family: Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        display: grid;
        min-height: 100vh;
        grid-template-rows: auto 1fr auto;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        padding: 0.75rem 1rem;
      }
      button {
        border: 1px solid #8564d4;
        border-radius: 999px;
        padding: 0.55rem 0.9rem;
        color: inherit;
        background: #312868;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 420px;
        touch-action: none;
      }
      output {
        font:
          0.8rem 'Fragment Mono',
          monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <strong>BodyParts3D respiratory spike</strong>
        <button id="overview" type="button">Overview</button>
        <button id="endoscopic" type="button">Endoscopic view</button>
      </header>
      <canvas aria-label="Interactive respiratory anatomy model"></canvas>
      <footer><output aria-live="polite">Loading model…</output></footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
