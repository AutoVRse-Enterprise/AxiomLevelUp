<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Simplified axial thorax</title>
  <desc id="desc">A non-diagnostic teaching diagram showing bilateral lungs around central mediastinal structures.</desc>
  <rect width="800" height="800" rx="40" fill="#071117"/>
  <ellipse cx="400" cy="410" rx="310" ry="285" fill="#b9c6c9"/>
  <ellipse cx="260" cy="400" rx="125" ry="205" fill="#182a31"/>
  <ellipse cx="540" cy="400" rx="125" ry="205" fill="#182a31"/>
  <ellipse cx="400" cy="420" rx="82" ry="135" fill="#64777d"/>
  <circle cx="400" cy="505" r="48" fill="#9eafb3"/>
  <g fill="none" stroke="#47c3ad" stroke-width="8" opacity=".75">
    <circle cx="260" cy="400" r="145"/><circle cx="540" cy="400" r="145"/>
  </g>
  <text x="400" y="735" text-anchor="middle" fill="#d7f7ef" font-family="sans-serif" font-size="24">Teaching diagram · not diagnostic</text>
</svg>
